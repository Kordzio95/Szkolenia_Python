<!DOCTYPE html>
<!-- typ dokumentu wyzej mowi przegladarce ze to html5 -->
<!-- strona po polsku -->
<html lang="pl">
<head>
  <!-- kodowanie znakow zeby polskie litery sie nie sypaly -->
  <meta charset="UTF-8">
  <!-- zeby na telefonie strona nie byla malutka -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- tytul na karcie przegladarki -->
  <title>Accountant - strona glowna</title>
  <!-- podpinamy plik ze stylami css -->
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
  <!-- gorny pasek z tytulem -->
  <header>
    <h1>Accountant - magazyn i ksiegowosc</h1>
    <!-- menu z linkami -->
    <nav>
      <a href="index.html">Strona glowna</a>
      <a href="historia.html">Historia</a>
    </nav>
  </header>

  <!-- glowna tresc strony -->
  <main>
    <!-- siatka z kartami -->
    <div class="karty">
      <!-- jedna karta -->
      <section class="karta">
        <h2>Aktualne saldo</h2>
        <p class="saldo">1 250,00 zl</p>
      </section>

      <!-- jedna karta -->
      <section class="karta">
        <h2>Stan magazynu</h2>
        <!-- tabela -->
        <table>
          <!-- naglowek tabeli -->
          <thead>
            <tr><th>Produkt</th><th>Cena</th><th>Ilosc</th></tr>
          </thead>
          <!-- wiersze z danymi -->
          <tbody>
            <tr><td>rower</td><td>100,00</td><td>3</td></tr>
            <tr><td>kask</td><td>45,00</td><td>10</td></tr>
          </tbody>
        </table>
      </section>
    </div>

    <!-- siatka z kartami -->
    <div class="karty" style="margin-top:16px">
      <!-- jedna karta -->
      <section class="karta">
        <h2>Zakup</h2>
        <!-- formularz, wysyla dane metoda POST -->
        <form method="post" action="#">
          <label for="zakup-nazwa">Nazwa produktu</label>
          <input id="zakup-nazwa" name="nazwa" type="text" required>
          <label for="zakup-cena">Cena jednostkowa</label>
          <input id="zakup-cena" name="cena" type="number" min="0.01" step="0.01" required>
          <label for="zakup-ilosc">Liczba sztuk</label>
          <input id="zakup-ilosc" name="ilosc" type="number" min="1" step="1" required>
          <!-- przycisk wysylajacy formularz -->
          <button type="submit">Kup</button>
        </form>
      </section>

      <!-- jedna karta -->
      <section class="karta">
        <h2>Sprzedaz</h2>
        <!-- formularz, wysyla dane metoda POST -->
        <form method="post" action="#">
          <label for="sprzedaz-nazwa">Nazwa produktu</label>
          <input id="sprzedaz-nazwa" name="nazwa" type="text" required>
          <label for="sprzedaz-cena">Cena jednostkowa</label>
          <input id="sprzedaz-cena" name="cena" type="number" min="0.01" step="0.01" required>
          <label for="sprzedaz-ilosc">Liczba sztuk</label>
          <input id="sprzedaz-ilosc" name="ilosc" type="number" min="1" step="1" required>
          <!-- przycisk wysylajacy formularz -->
          <button type="submit">Sprzedaj</button>
        </form>
      </section>

      <!-- jedna karta -->
      <section class="karta">
        <h2>Zmiana salda</h2>
        <!-- formularz, wysyla dane metoda POST -->
        <form method="post" action="#">
          <label for="saldo-komentarz">Komentarz</label>
          <input id="saldo-komentarz" name="komentarz" type="text">
          <label for="saldo-wartosc">Wartosc (minus = wyplata)</label>
          <input id="saldo-wartosc" name="wartosc" type="number" step="0.01" required>
          <!-- przycisk wysylajacy formularz -->
          <button type="submit">Zmien saldo</button>
        </form>
      </section>
    </div>
  </main>
</body>
</html>
